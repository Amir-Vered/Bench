[project]
name = "bench-mock-server"
version = "0.1.0"
description = "Mock Bench server for CLI testing"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.9"
]

[project.scripts]
bench-mock = "bench_mock_server.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"